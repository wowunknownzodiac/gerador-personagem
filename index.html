<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tormenta 20 - Área do Usuário</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #151515;
      color: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: #242424;
      border: 1px solid #3a3a3a;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #e1b84b;
    }

    h2, h3 {
      margin-bottom: 18px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #181818;
      color: white;
      font-size: 16px;
    }

    input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      background: #b52b2b;
      color: white;
      margin-bottom: 8px;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .secondary {
      background: #444;
    }

    .gold {
      background: #a8781b;
    }

    .hidden {
      display: none;
    }

    .separador {
      border: none;
      border-top: 1px solid #444;
      margin: 28px 0;
    }

    #mensagem {
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      background: #181818;
      min-height: 40px;
      white-space: pre-line;
    }

    .info {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .info p {
      margin: 6px 0;
    }

    .email-logado {
      color: #e1b84b;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .fichas-vazio {
      text-align: center;
      color: #bbb;
      padding: 15px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Tormenta 20</h1>

    <!-- ÁREA DE LOGIN / CADASTRO -->
    <div id="area-auth">

      <div class="tabs">
        <button id="btn-tab-login" onclick="mostrarLogin()">Entrar</button>
        <button id="btn-tab-cadastro" class="secondary" onclick="mostrarCadastro()">
          Criar conta
        </button>
      </div>

      <div id="form-login">
        <h2>Entrar</h2>

        <input
          id="login-email"
          type="email"
          placeholder="Seu e-mail"
        />

        <input
          id="login-senha"
          type="password"
          placeholder="Sua senha"
        />

        <button onclick="fazerLogin()">Entrar</button>
      </div>

      <div id="form-cadastro" class="hidden">
        <h2>Criar conta</h2>

        <input
          id="cadastro-email"
          type="email"
          placeholder="Seu e-mail"
        />

        <input
          id="cadastro-senha"
          type="password"
          placeholder="Crie uma senha"
        />

        <button onclick="fazerCadastro()">Cadastrar</button>
      </div>

    </div>


    <!-- ÁREA LOGADA -->
    <div id="area-usuario" class="hidden">

      <h2>Área do usuário</h2>

      <div class="info">
        <p>E-mail:</p>
        <p id="usuario-email" class="email-logado"></p>
      </div>

      <h3>Meu perfil</h3>

      <label for="perfil-nome">Nome</label>
      <input
        id="perfil-nome"
        type="text"
        placeholder="Seu nome"
      />

      <label for="perfil-username">Username</label>
      <input
        id="perfil-username"
        type="text"
        placeholder="Seu nome de usuário"
      />

      <button class="gold" onclick="salvarPerfil()">
        Salvar perfil
      </button>

      <hr class="separador">

      <h3>Minhas fichas</h3>

      <div class="fichas-vazio">
        Você ainda não possui personagens.
      </div>

      <button onclick="criarPersonagem()">
        + Criar personagem
      </button>

      <hr class="separador">

      <button class="secondary" onclick="fazerLogout()">
        Sair
      </button>

    </div>

    <div id="mensagem"></div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://bbcudrklvgrmksjstlsu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ejDBDTRN1TAZRiEqmXqoBw_RKzjw0J3";

    const supabaseClient =
      supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


    function exibirMensagem(texto) {
      document.getElementById("mensagem").textContent = texto;
    }


    function mostrarLogin() {
      document.getElementById("form-login").classList.remove("hidden");
      document.getElementById("form-cadastro").classList.add("hidden");

      document.getElementById("btn-tab-login").classList.remove("secondary");
      document.getElementById("btn-tab-cadastro").classList.add("secondary");

      exibirMensagem("");
    }


    function mostrarCadastro() {
      document.getElementById("form-cadastro").classList.remove("hidden");
      document.getElementById("form-login").classList.add("hidden");

      document.getElementById("btn-tab-cadastro").classList.remove("secondary");
      document.getElementById("btn-tab-login").classList.add("secondary");

      exibirMensagem("");
    }


    async function fazerCadastro() {
      const email =
        document.getElementById("cadastro-email").value.trim();

      const senha =
        document.getElementById("cadastro-senha").value;

      if (!email || !senha) {
        exibirMensagem("Preencha e-mail e senha.");
        return;
      }

      exibirMensagem("Criando conta...");

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: senha
        });

      if (error) {
        exibirMensagem(
          "Erro ao criar conta:\n" + error.message
        );
        return;
      }

      if (data.session) {
        exibirMensagem("Conta criada com sucesso.");
        await atualizarTela();
      } else {
        exibirMensagem(
          "Conta criada.\nVerifique seu e-mail para confirmar o cadastro."
        );
      }
    }


    async function fazerLogin() {
      const email =
        document.getElementById("login-email").value.trim();

      const senha =
        document.getElementById("login-senha").value;

      if (!email || !senha) {
        exibirMensagem("Preencha e-mail e senha.");
        return;
      }

      exibirMensagem("Entrando...");

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: senha
        });

      if (error) {
        exibirMensagem(
          "Não foi possível entrar:\n" + error.message
        );
        return;
      }

      exibirMensagem("Login realizado com sucesso.");
      await atualizarTela();
    }


    async function fazerLogout() {
      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {
        exibirMensagem(
          "Erro ao sair:\n" + error.message
        );
        return;
      }

      document.getElementById("perfil-nome").value = "";
      document.getElementById("perfil-username").value = "";

      exibirMensagem("Você saiu da sua conta.");

      await atualizarTela();
    }


    async function garantirPerfil(user) {
      const { data, error } =
        await supabaseClient
          .from("profiles")
          .select("id, nome, username")
          .eq("id", user.id)
          .maybeSingle();

      if (error) {
        console.error("Erro ao consultar perfil:", error);
        exibirMensagem(
          "Erro ao consultar perfil:\n" + error.message
        );
        return null;
      }

      if (data) {
        return data;
      }

      const { data: novoPerfil, error: erroCriacao } =
        await supabaseClient
          .from("profiles")
          .insert({
            id: user.id,
            nome: "",
            username: ""
          })
          .select()
          .single();

      if (erroCriacao) {
        console.error("Erro ao criar perfil:", erroCriacao);
        exibirMensagem(
          "Erro ao criar perfil:\n" + erroCriacao.message
        );
        return null;
      }

      return novoPerfil;
    }


    async function carregarPerfil(user) {
      const perfil = await garantirPerfil(user);

      if (!perfil) {
        return;
      }

      document.getElementById("perfil-nome").value =
        perfil.nome || "";

      document.getElementById("perfil-username").value =
        perfil.username || "";
    }


    async function salvarPerfil() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session || !session.user) {
        exibirMensagem("Você precisa estar logado.");
        return;
      }

      const nome =
        document.getElementById("perfil-nome").value.trim();

      const username =
        document.getElementById("perfil-username").value.trim();

      exibirMensagem("Salvando perfil...");

      const { error } =
        await supabaseClient
          .from("profiles")
          .update({
            nome: nome,
            username: username,
            updated_at: new Date().toISOString()
          })
          .eq("id", session.user.id);

      if (error) {
        exibirMensagem(
          "Erro ao salvar perfil:\n" + error.message
        );
        return;
      }

      exibirMensagem("Perfil salvo com sucesso.");
    }


    function criarPersonagem() {
      exibirMensagem(
        "O criador de personagens será implementado na próxima etapa."
      );
    }


    async function atualizarTela() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      const areaAuth =
        document.getElementById("area-auth");

      const areaUsuario =
        document.getElementById("area-usuario");

      if (session && session.user) {
        areaAuth.classList.add("hidden");
        areaUsuario.classList.remove("hidden");

        document.getElementById("usuario-email").textContent =
          session.user.email;

        await carregarPerfil(session.user);

      } else {
        areaUsuario.classList.add("hidden");
        areaAuth.classList.remove("hidden");
      }
    }


    supabaseClient.auth.onAuthStateChange(
      async () => {
        await atualizarTela();
      }
    );


    atualizarTela();
  </script>

</body>
</html>
